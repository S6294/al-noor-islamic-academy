<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedule Management - Admin | Al Noor Islamic Academy</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

body{
    min-height:100vh;
    background:#031713;
    color:#fff;
    padding:20px;
}

.container{
    width:min(900px,94%);
    margin:auto;
}

.header{
    background:linear-gradient(135deg,#123d31,#06271f);
    border:1px solid rgba(212,175,55,.20);
    border-radius:22px;
    padding:25px 20px;
    text-align:center;
    margin-bottom:22px;
}

.header h1{color:#f1d66b;margin-bottom:6px}
.header p{color:#aebfb9;font-size:13px}

.schedule-box{
    background:linear-gradient(145deg,#0a3026,#06241d);
    border:1px solid rgba(212,175,55,.20);
    border-radius:20px;
    padding:20px;
}

.day-row{
    background:#092b22;
    border:1px solid rgba(174,204,195,.14);
    border-radius:15px;
    padding:16px;
    margin-bottom:12px;
}

.day-name{
    color:#f1d66b;
    font-weight:bold;
    font-size:17px;
    margin-bottom:12px;
}

.fields{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

input{
    width:100%;
    padding:12px;
    border:0;
    border-radius:8px;
    background:#f5f5f5;
    color:#111;
}

button{
    width:100%;
    padding:13px;
    margin-top:18px;
    border:0;
    border-radius:9px;
    background:#d4af37;
    color:#071a17;
    font-weight:bold;
    cursor:pointer;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#d4af37;
    text-decoration:none;
}

.status{
    text-align:center;
    margin-top:15px;
    color:#aebfb9;
    font-size:13px;
}

@media(max-width:600px){
    .fields{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📅 Schedule Management</h1>
        <p>Set time and subject for the days you need.</p>
    </div>

    <div class="schedule-box">

        <div class="day-row">
            <div class="day-name">Saturday</div>
            <div class="fields">
                <input type="time" id="saturdayTime">
                <input type="text" id="saturdaySubject" placeholder="Subject">
            </div>
        </div>

        <div class="day-row">
            <div class="day-name">Sunday</div>
            <div class="fields">
                <input type="time" id="sundayTime">
                <input type="text" id="sundaySubject" placeholder="Subject">
            </div>
        </div>

        <div class="day-row">
            <div class="day-name">Monday</div>
            <div class="fields">
                <input type="time" id="mondayTime">
                <input type="text" id="mondaySubject" placeholder="Subject">
            </div>
        </div>

        <div class="day-row">
            <div class="day-name">Tuesday</div>
            <div class="fields">
                <input type="time" id="tuesdayTime">
                <input type="text" id="tuesdaySubject" placeholder="Subject">
            </div>
        </div>

        <div class="day-row">
            <div class="day-name">Wednesday</div>
            <div class="fields">
                <input type="time" id="wednesdayTime">
                <input type="text" id="wednesdaySubject" placeholder="Subject">
            </div>
        </div>

        <div class="day-row">
            <div class="day-name">Thursday</div>
            <div class="fields">
                <input type="time" id="thursdayTime">
                <input type="text" id="thursdaySubject" placeholder="Subject">
            </div>
        </div>

        <div class="day-row">
            <div class="day-name">Friday</div>
            <div class="fields">
                <input type="time" id="fridayTime">
                <input type="text" id="fridaySubject" placeholder="Subject">
            </div>
        </div>

        <button id="saveSchedule">💾 Save Schedule</button>
        <div class="status" id="status"></div>

    </div>

    <a href="admin.html" class="back">← Back to Admin Dashboard</a>

</div>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig = {
    apiKey: "AIzaSyBvugRPCyDcq0gJsE_eUsaoVExi5Rc614k",
    authDomain: "al-noor-islamic-academy.firebaseapp.com",
    projectId: "al-noor-islamic-academy",
    storageBucket: "al-noor-islamic-academy.firebasestorage.app",
    messagingSenderId: "571799539455",
    appId: "1:571799539455:web:d42728685908430296c6ca"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const days = [
    "saturday",
    "sunday",
    "monday",
    "tuesday",
    "wednesday",
    "thursday",
    "friday"
];

const status = document.getElementById("status");


async function loadSchedule(){

    try{

        const ref = doc(db, "schedule", "weekly");
        const snap = await getDoc(ref);

        if(!snap.exists()) return;

        const data = snap.data();

        days.forEach(day => {

            document.getElementById(day + "Time").value =
                data[day]?.time || "";

            document.getElementById(day + "Subject").value =
                data[day]?.subject || "";

        });

    }catch(error){

        console.error(error);
        status.textContent = "Unable to load schedule.";

    }

}


document.getElementById("saveSchedule").addEventListener("click", async () => {

    const schedule = {};

    days.forEach(day => {

        schedule[day] = {
            time: document.getElementById(day + "Time").value,
            subject: document.getElementById(day + "Subject").value.trim()
        };

    });

    try{

        await setDoc(
            doc(db, "schedule", "weekly"),
            schedule
        );

        status.textContent = "✓ Schedule saved successfully.";

    }catch(error){

        console.error(error);
        status.textContent = "Could not save schedule. Check Firestore rules.";

    }

});


onAuthStateChanged(auth, async user => {

    if(!user){

        window.location.replace("admin-login.html");
        return;

    }

    const adminRef = doc(db, "admins", user.uid);
    const adminSnap = await getDoc(adminRef);

    if(!adminSnap.exists()){

        alert("Access denied. Admin account required.");
        window.location.replace("admin-login.html");
        return;

    }

    await loadSchedule();

});
</script>

</body>
</html>
