<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Notifications - Al Noor Islamic Academy</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#071c16;
    color:white;
}

header{
    background:#0d2b22;
    padding:18px 20px;
    border-bottom:1px solid #c9a227;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:#d4af37;
    font-size:20px;
    font-weight:bold;
}

.back{
    color:#d4af37;
    text-decoration:none;
}

.container{
    max-width:900px;
    margin:auto;
    padding:25px 18px;
}

h1{
    margin-bottom:20px;
}

.form-box{
    background:#0d2b22;
    padding:20px;
    border-radius:14px;
    border:1px solid #21473b;
    margin-bottom:30px;
}

input,
textarea,
select{
    width:100%;
    padding:13px;
    margin-top:8px;
    margin-bottom:15px;
    border-radius:8px;
    border:1px solid #31584b;
    background:#071c16;
    color:white;
    outline:none;
}

textarea{
    min-height:100px;
    resize:vertical;
}

label{
    color:#d4af37;
    font-weight:bold;
}

button{
    border:none;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.send-btn{
    background:#d4af37;
    color:#071c16;
}

.cancel-btn{
    background:#555;
    color:white;
    margin-left:8px;
    display:none;
}

.notification{
    background:#0d2b22;
    border:1px solid #21473b;
    border-radius:14px;
    padding:18px;
    margin-bottom:15px;
}

.notification h3{
    color:#d4af37;
    margin-bottom:8px;
}

.notification p{
    color:#c8d2ce;
    line-height:1.5;
    margin-bottom:10px;
}

.date{
    color:#8da39a;
    font-size:13px;
}

.actions{
    margin-top:15px;
}

.edit-btn{
    background:#d4af37;
    color:#071c16;
}

.delete-btn{
    background:#a83232;
    color:white;
    margin-left:7px;
}

#loading{
    text-align:center;
    padding:60px 20px;
    color:#d4af37;
}

#content{
    display:none;
}

.empty{
    text-align:center;
    padding:30px;
    color:#9eb0a9;
}
</style>
</head>

<body>

<div id="loading">
    Checking admin access...
</div>

<div id="content">

<header>

    <div class="logo">
        AL NOOR ADMIN
    </div>

    <a href="admin.html" class="back">
        ← Dashboard
    </a>

</header>

<div class="container">

    <h1>🔔 Notifications</h1>

    <div class="form-box">

        <label>Notification Title</label>
        <input
            type="text"
            id="title"
            placeholder="Enter notification title"
        >

        <label>Message</label>
        <textarea
            id="message"
            placeholder="Write notification message..."
        ></textarea>

        <label>Icon</label>
        <select id="icon">
            <option value="🔔">🔔 Notification</option>
            <option value="📢">📢 Announcement</option>
            <option value="📚">📚 Course</option>
            <option value="🎥">🎥 Live Class</option>
            <option value="💳">💳 Payment</option>
            <option value="📖">📖 Quran</option>
        </select>

        <br>

        <button
            class="send-btn"
            id="sendBtn"
        >
            Send Notification
        </button>

        <button
            class="cancel-btn"
            id="cancelBtn"
        >
            Cancel
        </button>

    </div>


    <h2 style="margin-bottom:15px;">
        All Notifications
    </h2>

    <div id="notificationList">
        Loading...
    </div>

</div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs,
    addDoc,
    updateDoc,
    deleteDoc,
    doc,
    getDoc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyBvugRPCyDcq0gJsE_eUsaoVExi5Rc614k",

    authDomain:
    "al-noor-islamic-academy.firebaseapp.com",

    projectId:
    "al-noor-islamic-academy",

    storageBucket:
    "al-noor-islamic-academy.firebasestorage.app",

    messagingSenderId:
    "571799539455",

    appId:
"1:571799539455:web:d42728685908430296c6ca"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


const loading =
document.getElementById("loading");

const content =
document.getElementById("content");

const titleInput =
document.getElementById("title");

const messageInput =
document.getElementById("message");

const iconInput =
document.getElementById("icon");

const sendBtn =
document.getElementById("sendBtn");

const cancelBtn =
document.getElementById("cancelBtn");

const list =
document.getElementById("notificationList");


let editingId = null;


// ADMIN CHECK
onAuthStateChanged(auth, async (user) => {

    if(!user){

        window.location.href =
        "admin-login.html";

        return;
    }

    try{

        const adminRef =
        doc(db,"admins",user.uid);

        const adminSnap =
        await getDoc(adminRef);

        if(!adminSnap.exists()){

            alert(
                "Access denied. Admin only."
            );

            await signOut(auth);

            window.location.href =
            "admin-login.html";

            return;
        }

        loading.style.display = "none";

        content.style.display = "block";

        loadNotifications();

    }catch(error){

        console.error(error);

        alert(
            "Admin verification failed."
        );

        await signOut(auth);

        window.location.href =
        "admin-login.html";
    }

});


// LOAD NOTIFICATIONS
async function loadNotifications(){

    list.innerHTML = "Loading...";

    try{

        const snapshot =
        await getDocs(
            collection(db,"notifications")
        );

        list.innerHTML = "";

        if(snapshot.empty){

            list.innerHTML =
            '<div class="empty">No notifications available.</div>';

            return;
        }


        snapshot.forEach((item) => {

            const data = item.data();

            let dateText = "";

            if(data.createdAt){

                try{

                    dateText =
                    data.createdAt
                    .toDate()
                    .toLocaleString();

                }catch(e){

                    dateText = "";
                }
            }


            const div =
            document.createElement("div");

            div.className =
            "notification";


            div.innerHTML = `

                <h3>
                    ${data.icon || "🔔"}
                    ${escapeHtml(data.title || "")}
                </h3>

                <p>
                    ${escapeHtml(data.message || "")}
                </p>

                <div class="date">
                    ${dateText}
                </div>

                <div class="actions">

                    <button
                        class="edit-btn"
                        data-id="${item.id}"
                    >
                        Edit
                    </button>

                    <button
                        class="delete-btn"
                        data-id="${item.id}"
                    >
                        Delete
                    </button>

                </div>
            `;


            div.querySelector(".edit-btn")
            .addEventListener("click", () => {

                editNotification(
                    item.id,
                    data
                );

            });


            div.querySelector(".delete-btn")
            .addEventListener("click", () => {

                removeNotification(
                    item.id
                );

            });


            list.appendChild(div);

        });

    }catch(error){

        console.error(error);

        list.innerHTML =
        '<div class="empty">Failed to load notifications.</div>';
    }
}


// SEND / UPDATE
sendBtn.addEventListener("click", async () => {

    const title =
    titleInput.value.trim();

    const message =
    messageInput.value.trim();

    const icon =
    iconInput.value;


    if(!title || !message){

        alert(
            "Please enter title and message."
        );

        return;
    }


    sendBtn.disabled = true;

    try{

        if(editingId){

            await updateDoc(
                doc(
                    db,
                    "notifications",
                    editingId
                ),
                {
                    title: title,
                    message: message,
                    icon: icon,
                    updatedAt: serverTimestamp()
                }
            );

            alert(
                "Notification updated successfully."
            );

        }else{

            await addDoc(
                collection(db,"notifications"),
                {
                    title: title,
                    message: message,
                    icon: icon,
                    isNew: true,
                    createdAt: serverTimestamp()
                }
            );

            alert(
                "Notification sent successfully."
            );
        }


        clearForm();

        await loadNotifications();

    }catch(error){

        console.error(error);

        alert(
            "Operation failed: " +
            error.message
        );

    }finally{

        sendBtn.disabled = false;
    }

});


// EDIT
function editNotification(id,data){

    editingId = id;

    titleInput.value =
    data.title || "";

    messageInput.value =
    data.message || "";

    iconInput.value =
    data.icon || "🔔";

    sendBtn.textContent =
    "Update Notification";

    cancelBtn.style.display =
    "inline-block";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


// CANCEL EDIT
cancelBtn.addEventListener(
    "click",
    clearForm
);


function clearForm(){

    editingId = null;

    titleInput.value = "";

    messageInput.value = "";

    iconInput.value = "🔔";

    sendBtn.textContent =
    "Send Notification";

    cancelBtn.style.display =
    "none";
}


// DELETE
async function removeNotification(id){

    const confirmDelete =
    confirm(
        "Are you sure you want to delete this notification?"
    );

    if(!confirmDelete) return;


    try{

        await deleteDoc(
            doc(
                db,
                "notifications",
                id
            )
        );

        alert(
            "Notification deleted."
        );

        await loadNotifications();

    }catch(error){

        console.error(error);

        alert(
            "Delete failed: " +
            error.message
        );
    }

}


// SECURITY: prevent HTML injection
function escapeHtml(value){

    return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

</script>

</body>
    </html>
