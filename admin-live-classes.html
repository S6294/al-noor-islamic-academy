<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Classes - Admin | Al Noor Islamic Academy</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#071d17;
    color:white;
}

.header{
    background:#0d3027;
    padding:18px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #c9a227;
}

.logo{
    color:#d4af37;
    font-size:22px;
    font-weight:bold;
}

.admin{
    color:#d4af37;
}

.container{
    max-width:900px;
    margin:auto;
    padding:25px 18px;
}

h1{
    color:#d4af37;
    margin-bottom:20px;
}

.add-box{
    background:#0d3027;
    padding:20px;
    border-radius:15px;
    border:1px solid #80691d;
    margin-bottom:30px;
}

.add-box h2{
    color:#d4af37;
    margin-bottom:18px;
}

input,
select{
    width:100%;
    padding:13px;
    margin-bottom:12px;
    border:none;
    border-radius:8px;
    background:#f5f5f5;
    color:#111;
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:#d4af37;
    color:#071d17;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

.cancel-btn{
    background:#555;
    color:white;
    margin-top:10px;
    display:none;
}

.class-card{
    background:#0d3027;
    padding:20px;
    margin-bottom:15px;
    border-radius:15px;
    border:1px solid #80691d;
}

.class-card h3{
    color:#d4af37;
    margin-bottom:10px;
}

.info{
    line-height:1.8;
    color:#ddd;
}

.status{
    display:inline-block;
    margin-top:10px;
    padding:5px 10px;
    border-radius:20px;
    background:#174d3d;
    color:#7ff0b7;
    font-size:13px;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.actions button{
    width:50%;
}

.delete{
    background:#8b2525;
    color:white;
}

.empty{
    text-align:center;
    color:#aaa;
    padding:30px;
}

.back{
    display:block;
    text-align:center;
    margin-top:25px;
    color:#d4af37;
    text-decoration:none;
}


/* Delete Modal */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:999;
}

.modal-box{
    width:100%;
    max-width:380px;
    background:#0d3027;
    border:1px solid #d4af37;
    border-radius:15px;
    padding:25px;
    text-align:center;
}

.modal-box h3{
    color:#d4af37;
    margin-bottom:12px;
}

.modal-box p{
    color:#ddd;
    margin-bottom:20px;
}

.modal-actions{
    display:flex;
    gap:10px;
}

.modal-actions button{
    width:50%;
}

.confirm-delete{
    background:#8b2525;
    color:white;
}

.cancel-delete{
    background:#555;
    color:white;
}

</style>

</head>


<body>


<header class="header">

    <div class="logo">
        AL NOOR
    </div>

    <div class="admin">
        👑 Admin
    </div>

</header>


<div class="container">

<h1>
    Live Classes Management
</h1>


<div class="add-box">

<h2 id="formTitle">
    ➕ Add Live Class
</h2>


<input
    type="text"
    id="course"
    placeholder="Course Name"
>


<input
    type="text"
    id="teacher"
    placeholder="Teacher Name"
>


<input
    type="date"
    id="date"
>


<input
    type="time"
    id="time"
>


<select id="duration">

    <option value="30">
        Duration: 30 Minutes
    </option>

    <option value="60" selected>
        Duration: 60 Minutes
    </option>

    <option value="90">
        Duration: 90 Minutes
    </option>

</select>


<input
    type="text"
    id="platform"
    placeholder="Platform (Google Meet / Zoom)"
>


<input
    type="url"
    id="link"
    placeholder="Live Class Link"
>


<button id="saveBtn">
    Add Live Class
</button>


<button
    id="cancelBtn"
    class="cancel-btn"
>
    Cancel Edit
</button>

</div>


<h2 style="color:#d4af37;margin-bottom:15px;">

    Upcoming & Live Classes

</h2>


<div id="classList">

    <div class="empty">
        Loading classes...
    </div>

</div>


<a
    href="admin.html"
    class="back"
>
    ← Back to Admin Dashboard
</a>

</div>


<!-- Delete Modal -->

<div
    class="modal"
    id="deleteModal"
>

<div class="modal-box">

<h3>
    Delete Live Class?
</h3>

<p>
    Are you sure you want to delete this live class?
</p>

<div class="modal-actions">

<button
    class="cancel-delete"
    id="cancelDelete"
>
    Cancel
</button>

<button
    class="confirm-delete"
    id="confirmDelete"
>
    Delete
</button>

</div>

</div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    doc,
    updateDoc,
    deleteDoc,
    getDoc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* Firebase */

const firebaseConfig = {

    apiKey:
        "AIzaSyBvugRPCyDcq0gJsE_eUsaoVExi5Rc614k",

    authDomain:
        "al-noor-islamic-academy.firebaseapp.com",

    projectId:
        "al-noor-islamic-academy",

    storageBucket:
        "al-noor-islamic-academy.firebasestorage.app",

    messagingSenderId:
        "571799539455",

    appId:
        "1:571799539455:web:d42728685908430296c6ca"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* Elements */

const classList =
    document.getElementById("classList");

const courseInput =
    document.getElementById("course");

const teacherInput =
    document.getElementById("teacher");

const dateInput =
    document.getElementById("date");

const timeInput =
    document.getElementById("time");

const durationInput =
    document.getElementById("duration");

const platformInput =
    document.getElementById("platform");

const linkInput =
    document.getElementById("link");

const saveBtn =
    document.getElementById("saveBtn");

const cancelBtn =
    document.getElementById("cancelBtn");

const formTitle =
    document.getElementById("formTitle");

const deleteModal =
    document.getElementById("deleteModal");

const cancelDelete =
    document.getElementById("cancelDelete");

const confirmDelete =
    document.getElementById("confirmDelete");


let editId = null;

let deleteId = null;


/* Admin Check */

onAuthStateChanged(auth, async (user) => {

    if(!user){

        window.location.href =
            "admin-login.html";

        return;
    }


    try{

        const adminRef =
            doc(
                db,
                "admins",
                user.uid
            );


        const adminSnap =
            await getDoc(adminRef);


        if(!adminSnap.exists()){

            alert(
                "Access denied. Admin only."
            );

            window.location.href =
                "index.html";

            return;
        }


        loadClasses();

    }catch(error){

        console.error(error);

        alert(
            "Admin verification failed."
        );

    }

});


/* Load Classes */

async function loadClasses(){

    classList.innerHTML =
        '<div class="empty">Loading classes...</div>';


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "liveClasses"
                )
            );


        classList.innerHTML = "";


        if(snapshot.empty){

            classList.innerHTML =
                '<div class="empty">No live classes added yet.</div>';

            return;
        }


        let classes = [];


        snapshot.forEach((item) => {

            classes.push({

                id:item.id,

                ...item.data()

            });

        });


        classes.sort((a,b) => {

            const first =
                `${a.date || ""} ${a.time || ""}`;

            const second =
                `${b.date || ""} ${b.time || ""}`;

            return first.localeCompare(
                second
            );

        });


        classes.forEach(item => {

            createCard(item);

        });


    }catch(error){

        console.error(error);

        classList.innerHTML =
            '<div class="empty">Unable to load classes.</div>';

    }

}


/* Create Card */

function createCard(item){

    const card =
        document.createElement("div");

    card.className =
        "class-card";


    const title =
        document.createElement("h3");

    title.textContent =
        "📚 " +
        (
            item.course ||
            "Live Class"
        );


    const info =
        document.createElement("div");

    info.className =
        "info";


    const duration =
        item.duration ||
        60;


    info.innerHTML =

        `👨‍🏫 Teacher:
        ${escapeHtml(
            item.teacher || ""
        )}<br>

        📅 Date:
        ${escapeHtml(
            item.date || ""
        )}<br>

        ⏰ Time:
        ${escapeHtml(
            item.time || ""
        )}<br>

        ⏱️ Duration:
        ${duration} Minutes<br>

        💻 Platform:
        ${escapeHtml(
            item.platform || ""
        )}`;


    const status =
        document.createElement("span");

    status.className =
        "status";


    const currentStatus =
        getStatus(item);


    if(currentStatus === "live"){

        status.textContent =
            "🔴 LIVE NOW";

        status.style.color =
            "#ff8a8a";

    }
    else if(currentStatus === "ended"){

        status.textContent =
            "⚪ ENDED";

        status.style.color =
            "#aaa";

    }
    else{

        status.textContent =
            "🟢 UPCOMING";

    }


    const actions =
        document.createElement("div");

    actions.className =
        "actions";


    const editBtn =
        document.createElement("button");

    editBtn.textContent =
        "✏️ Edit";


    editBtn.onclick = () => {

        startEdit(item);

    };


    const deleteBtn =
        document.createElement("button");

    deleteBtn.className =
        "delete";

    deleteBtn.textContent =
        "🗑️ Delete";


    deleteBtn.onclick = () => {

        openDeleteModal(item.id);

    };


    actions.appendChild(editBtn);

    actions.appendChild(deleteBtn);


    card.appendChild(title);

    card.appendChild(info);

    card.appendChild(status);

    card.appendChild(actions);


    classList.appendChild(card);

}


/* Status */

function getStatus(item){

    if(
        !item.date ||
        !item.time
    ){

        return "upcoming";

    }


    const start =
        new Date(
            `${item.date}T${item.time}:00`
        );


    const duration =
        Number(
            item.duration || 60
        );


    const end =
        new Date(
            start.getTime() +
            duration * 60 * 1000
        );


    const now =
        new Date();


    if(now < start){

        return "upcoming";

    }


    if(
        now >= start &&
        now < end
    ){

        return "live";

    }


    return "ended";

}


/* Escape HTML */

function escapeHtml(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* Add / Update */

saveBtn.addEventListener(
    "click",
    async () => {

    const course =
        courseInput.value.trim();

    const teacher =
        teacherInput.value.trim();

    const date =
        dateInput.value;

    const time =
        timeInput.value;

    const duration =
        Number(
            durationInput.value
        );

    const platform =
        platformInput.value.trim();

    const link =
        linkInput.value.trim();


    if(
        !course ||
        !teacher ||
        !date ||
        !time ||
        !platform ||
        !link
    ){

        alert(
            "Please fill all fields."
        );

        return;

    }


    saveBtn.disabled =
        true;

    saveBtn.textContent =
        "Saving...";


    try{

        if(editId){

            await updateDoc(

                doc(
                    db,
                    "liveClasses",
                    editId
                ),

                {

                    course,

                    teacher,

                    date,

                    time,

                    duration,

                    platform,

                    link,

                    updatedAt:
                        serverTimestamp()

                }

            );


            alert(
                "Live Class Updated Successfully!"
            );

        }
        else{

            await addDoc(

                collection(
                    db,
                    "liveClasses"
                ),

                {

                    course,

                    teacher,

                    date,

                    time,

                    duration,

                    platform,

                    link,

                    createdAt:
                        serverTimestamp()

                }

            );


            alert(
                "Live Class Added Successfully!"
            );

        }


        resetForm();

        loadClasses();


    }catch(error){

        console.error(error);

        alert(
            "Error: " +
            error.message
        );

    }


    saveBtn.disabled =
        false;

});


/* Edit */

function startEdit(item){

    editId =
        item.id;


    courseInput.value =
        item.course || "";


    teacherInput.value =
        item.teacher || "";


    dateInput.value =
        item.date || "";


    timeInput.value =
        item.time || "";


    durationInput.value =
        String(
            item.duration || 60
        );


    platformInput.value =
        item.platform || "";


    linkInput.value =
        item.link || "";


    formTitle.textContent =
        "✏️ Edit Live Class";


    saveBtn.textContent =
        "Update Live Class";


    cancelBtn.style.display =
        "block";


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* Cancel Edit */

cancelBtn.addEventListener(
    "click",
    () => {

        resetForm();

    }
);


/* Reset */

function resetForm(){

    editId = null;


    courseInput.value =
        "";

    teacherInput.value =
        "";

    dateInput.value =
        "";

    timeInput.value =
        "";


    durationInput.value =
        "60";


    platformInput.value =
        "";

    linkInput.value =
        "";


    formTitle.textContent =
        "➕ Add Live Class";


    saveBtn.textContent =
        "Add Live Class";


    cancelBtn.style.display =
        "none";

}


/* Delete Modal */

function openDeleteModal(id){

    deleteId =
        id;


    deleteModal.style.display =
        "flex";

}


cancelDelete.addEventListener(
    "click",
    () => {

        deleteId =
            null;

        deleteModal.style.display =
            "none";

    }
);


confirmDelete.addEventListener(
    "click",
    async () => {

    if(!deleteId){

        return;

    }


    confirmDelete.disabled =
        true;

    confirmDelete.textContent =
        "Deleting...";


    try{

        await deleteDoc(

            doc(
                db,
                "liveClasses",
                deleteId
            )

        );


        deleteId =
            null;


        deleteModal.style.display =
            "none";


        alert(
            "Live Class Deleted Successfully!"
        );


        loadClasses();


    }catch(error){

        console.error(error);

        alert(
            "Delete failed: " +
            error.message
        );

    }


    confirmDelete.disabled =
        false;

    confirmDelete.textContent =
        "Delete";

});


</script>

</body>
    </html>
