<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Payment | Al Noor Islamic Academy</title>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{

  background:#071c16;

  color:white;

  min-height:100vh;

  padding:25px;

}

.container{

  max-width:500px;

  margin:40px auto;

  background:#0d2a22;

  padding:30px;

  border-radius:18px;

  border:1px solid #d4af37;

}

h1{

  text-align:center;

  color:#d4af37;

  margin-bottom:25px;

}

.plan{

  text-align:center;

  margin-bottom:25px;

}

.plan-name{

  font-size:24px;

  font-weight:bold;

  margin-bottom:10px;

}

.price{

  font-size:32px;

  color:#d4af37;

  font-weight:bold;

}

label{

  display:block;

  margin-top:15px;

  margin-bottom:6px;

}

input{

  width:100%;

  padding:13px;

  border-radius:8px;

  border:1px solid #555;

  background:#071c16;

  color:white;

}

button{

  width:100%;

  margin-top:25px;

  padding:14px;

  border:none;

  border-radius:8px;

  background:#d4af37;

  color:#071c16;

  font-size:17px;

  font-weight:bold;

  cursor:pointer;

}

button:disabled{

  opacity:.6;

  cursor:not-allowed;

}

#message{

  text-align:center;

  margin-top:18px;

  color:#d4af37;

  line-height:1.6;

}

</style>

</head>


<body>


<div class="container">


<h1>

Al Noor Islamic Academy

</h1>


<div class="plan">


<div
class="plan-name"
id="planName">

Membership

</div>


<div class="price">

₹<span id="planPrice">0</span>

</div>


</div>



<label>

Full Name

</label>


<input
type="text"
id="name"
readonly>



<label>

Email

</label>


<input
type="email"
id="email"
readonly>



<label>

Mobile

</label>


<input
type="text"
id="mobile"
readonly>



<button
id="payBtn">

Pay Now

</button>


<div
id="message">

</div>


</div>



<script type="module">


/* =========================
   FIREBASE
========================= */

import {

  initializeApp

}

from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {

  getAuth,
  onAuthStateChanged

}

from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  updateDoc,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";



const firebaseConfig = {

  apiKey:
  "AIzaSyBvugRPCyDcq0gJsE_eUsaoVExi5Rc614k",

  authDomain:
  "al-noor-islamic-academy.firebaseapp.com",

  projectId:
  "al-noor-islamic-academy",

  storageBucket:
  "al-noor-islamic-academy.firebasestorage.app",

  messagingSenderId:
  "571799539455",

  appId:
  "1:571799539455:web:d42728685908430296c6ca"

};



const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const db =
getFirestore(app);



/* =========================
   BACKEND
========================= */

const BACKEND_URL =
"https://script.google.com/macros/s/AKfycbyCH2v1uORdSwK42KMe89uvawYaeX-QCynsvTuv2Auorcl31e9CG5SVXj9hYHnJduX6Nw/exec";



/* =========================
   RAZORPAY TEST KEY
========================= */

const RAZORPAY_KEY_ID =
"rzp_test_TdwKPsC4k8qiM5";



/* =========================
   ELEMENTS
========================= */

const payBtn =
document.getElementById("payBtn");

const message =
document.getElementById("message");

const nameInput =
document.getElementById("name");

const emailInput =
document.getElementById("email");

const mobileInput =
document.getElementById("mobile");

const planNameElement =
document.getElementById("planName");

const planPriceElement =
document.getElementById("planPrice");



/* =========================
   PLAN FROM URL
========================= */

const params =
new URLSearchParams(
window.location.search
);


const plan =
params.get("plan");


const urlPlanName =
params.get("name");


const urlPlanPrice =
params.get("price");



planNameElement.textContent =
urlPlanName || "Membership";


planPriceElement.textContent =
urlPlanPrice || "0";



/* =========================
   CURRENT USER
========================= */

let currentUser = null;



onAuthStateChanged(
auth,
async (user) => {


  if(!user){

    window.location.href =
    "login.html";

    return;

  }


  currentUser =
  user;


  emailInput.value =
  user.email || "";


  try{


    const studentRef =
    doc(
      db,
      "students",
      user.uid
    );


    const studentSnap =
    await getDoc(
      studentRef
    );


    if(studentSnap.exists()){

      const data =
      studentSnap.data();


      nameInput.value =
      data.name ||
      user.displayName ||
      "";


      mobileInput.value =
      data.mobile ||
      "";

    }

    else{

      nameInput.value =
      user.displayName ||
      "";

    }


  }

  catch(error){

    console.error(
      "Student profile error:",
      error
    );

  }

});



/* =========================
   JSONP HELPER
========================= */

function jsonpRequest(
  url
){

  return new Promise(
    (resolve,reject) => {


      const callbackName =
      "callback_" +
      Date.now() +
      "_" +
      Math.random()
      .toString(36)
      .substring(2);


      const script =
      document.createElement("script");


      const separator =
      url.includes("?")
      ? "&"
      : "?";


      const finalUrl =
      url +
      separator +
      "callback=" +
      encodeURIComponent(
        callbackName
      );


      window[callbackName] =
      function(data){

        cleanup();

        resolve(data);

      };


      function cleanup(){

        delete window[
          callbackName
        ];

        script.remove();

      }


      script.src =
      finalUrl;


      script.onerror =
      function(){

        cleanup();

        reject(
          new Error(
            "Unable to connect to payment server."
          )
        );

      };


      document.body.appendChild(
        script
      );


    }
  );

}



/* =========================
   PAY NOW
========================= */

payBtn.addEventListener(
"click",
async () => {


  if(!currentUser){

    message.textContent =
    "Please login first.";

    return;

  }


  if(!plan){

    message.textContent =
    "Invalid membership plan.";

    return;

  }


  if(!RAZORPAY_KEY_ID){

    message.textContent =
    "Razorpay Test Key ID is missing.";

    return;

  }


  payBtn.disabled =
  true;


  payBtn.textContent =
  "Creating Order...";


  message.textContent =
  "Please wait...";


  try{


    /* =========================
       CREATE ORDER
    ========================= */

    const orderResult =
    await jsonpRequest(
      BACKEND_URL +
      "?plan=" +
      encodeURIComponent(plan)
    );


    console.log(
      "Order result:",
      orderResult
    );


    if(!orderResult.success){

      throw new Error(
        orderResult.message ||
        "Order creation failed."
      );

    }


    /* =========================
       USE REAL BACKEND PRICE
    ========================= */

    planNameElement.textContent =
    orderResult.plan_name;


    planPriceElement.textContent =
    orderResult.price;


    /* =========================
       RAZORPAY CHECKOUT
    ========================= */

    const options = {

      key:
      RAZORPAY_KEY_ID,


      amount:
      orderResult.amount,


      currency:
      orderResult.currency,


      name:
      "Al Noor Islamic Academy",


      description:
      orderResult.plan_name,


      order_id:
      orderResult.order_id,


      prefill: {

        name:
        nameInput.value,

        email:
        emailInput.value,

        contact:
        mobileInput.value

      },


      theme: {

        color:
        "#d4af37"

      },


      handler:
      async function(response){


        console.log(
          "Razorpay response:",
          response
        );


        message.textContent =
        "Verifying payment...";


        try{


          /* =========================
             VERIFY PAYMENT
          ========================= */

          const verifyResult =
          await jsonpRequest(

            BACKEND_URL +

            "?action=verify" +

            "&payment_id=" +
            encodeURIComponent(
              response.razorpay_payment_id
            ) +

            "&order_id=" +
            encodeURIComponent(
              response.razorpay_order_id
            ) +

            "&signature=" +
            encodeURIComponent(
              response.razorpay_signature
            )

          );


          console.log(
            "Verification result:",
            verifyResult
          );


          if(
            !verifyResult.success
          ){

            throw new Error(
              verifyResult.message ||
              "Payment verification failed."
            );

          }
          /* =========================
   ACTIVATE MEMBERSHIP
========================= */

const studentRef = doc(
  db,
  "students",
  currentUser.uid
);

await updateDoc(studentRef, {

  membershipActive: true,

  membershipPlan: orderResult.plan,

  membershipPlanName: orderResult.plan_name,

  membershipPrice: orderResult.price,

  paymentId: response.razorpay_payment_id,

  orderId: response.razorpay_order_id,

  membershipActivatedAt: serverTimestamp()

});


          /* =========================
             VERIFIED
          ========================= */

          message.innerHTML =

          "✅ Payment verified successfully." +

          "<br><br>" +

          "Payment ID: " +

          response.razorpay_payment_id;


          payBtn.disabled =
          false;


          payBtn.textContent =
          "Payment Verified";


        }

        catch(error){

          console.error(
            error
          );


          message.textContent =
          "Payment verification failed: " +
          error.message;


          payBtn.disabled =
          false;


          payBtn.textContent =
          "Pay Now";

        }

      },


      modal: {

        ondismiss:
        function(){

          payBtn.disabled =
          false;


          payBtn.textContent =
          "Pay Now";


          message.textContent =
          "Payment window closed.";

        }

      }

    };


    const razorpay =
    new Razorpay(
      options
    );


    razorpay.on(
      "payment.failed",
      function(response){

        console.error(
          "Payment failed:",
          response.error
        );


        message.textContent =
        response.error.description ||
        "Payment failed.";


        payBtn.disabled =
        false;


        payBtn.textContent =
        "Pay Now";

      }
    );


    razorpay.open();


  }

  catch(error){

    console.error(
      "Payment error:",
      error
    );


    message.textContent =
    error.message ||
    "Unable to create payment order.";


    payBtn.disabled =
    false;


    payBtn.textContent =
    "Pay Now";

  }

});

</script>


</body>

</html>
