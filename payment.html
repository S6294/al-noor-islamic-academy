<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Payment | Al Noor Islamic Academy</title>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #071c16;
      color: white;
      min-height: 100vh;
      padding: 25px;
    }

    .container {
      max-width: 500px;
      margin: 40px auto;
      background: #0d2a22;
      padding: 30px;
      border-radius: 18px;
      border: 1px solid #d4af37;
    }

    h1 {
      text-align: center;
      color: #d4af37;
      margin-bottom: 25px;
    }

    .plan {
      text-align: center;
      margin-bottom: 25px;
    }

    .plan-name {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .price {
      font-size: 32px;
      color: #d4af37;
      font-weight: bold;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #555;
      background: #071c16;
      color: white;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #d4af37;
      color: #071c16;
      font-size: 17px;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      text-align: center;
      margin-top: 18px;
      color: #d4af37;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Al Noor Islamic Academy</h1>

  <div class="plan">
    <div class="plan-name" id="planName">Course</div>

    <div class="price">
      ₹<span id="planPrice">0</span>
    </div>
  </div>

  <label>Full Name</label>
  <input type="text" id="name" readonly>

  <label>Email</label>
  <input type="email" id="email" readonly>

  <label>Mobile</label>
  <input type="text" id="mobile" readonly>

  <button id="payBtn">Pay Now</button>

  <div id="message"></div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  updateDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


// =========================
// FIREBASE
// =========================

const firebaseConfig = {

  apiKey:
    "AIzaSyBvugRPCyDcq0gJsE_eUsaoVExi5Rc614k",

  authDomain:
    "al-noor-islamic-academy.firebaseapp.com",

  projectId:
    "al-noor-islamic-academy",

  storageBucket:
    "al-noor-islamic-academy.firebasestorage.app",

  messagingSenderId:
    "571799539455",

  appId:
    "1:571799539455:web:d42728685908430296c6ca"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


// =========================
// BACKEND
// =========================

const BACKEND_URL =
"https://script.google.com/macros/s/AKfycbyCH2v1uORdSwK42KMe89uvawYaeX-QCynsvTuv2Auorcl31e9CG5SVXj9hYHnJduX6Nw/exec";


// =========================
// RAZORPAY TEST KEY
// =========================

// এখানে তোমার সম্পূর্ণ Test Key ID বসাও

const RAZORPAY_KEY_ID =
"rzp_test_TdwKPsC4k8qiM5";


// =========================
// PLAN
// =========================

const params =
new URLSearchParams(window.location.search);

const course =
params.get("course");

const courseName =
params.get("name");

const coursePrice =
params.get("price");

const validCourses = {
  "tajweed": {
    name: "Tajweed",
    price: "299"
  },
  "arabic-language": {
    name: "Arabic Language",
    price: "299"
  }
};

const selectedCourse = validCourses[course];

if (selectedCourse) {
  document.getElementById("planName").textContent =
    selectedCourse.name;

  document.getElementById("planPrice").textContent =
    selectedCourse.price;
} else {
  document.getElementById("planName").textContent =
    "Invalid Course";

  document.getElementById("planPrice").textContent =
    "0";
}


// =========================
// USER
// =========================

let currentUser = null;


onAuthStateChanged(auth, async (user) => {

  if (!user) {

    window.location.href =
    "login.html";

    return;
  }

  currentUser = user;

  document.getElementById("email").value =
  user.email || "";


  try {

    const studentRef =
    doc(db, "students", user.uid);

    const studentSnap =
    await getDoc(studentRef);


    if (studentSnap.exists()) {

      const data =
      studentSnap.data();

      document.getElementById("name").value =
      data.name || user.displayName || "";

      document.getElementById("mobile").value =
      data.mobile || "";

    } else {

      document.getElementById("name").value =
      user.displayName || "";

    }

  } catch (error) {

    console.error(error);

  }

});


// =========================
// PAY NOW
// =========================

document.getElementById("payBtn")
.addEventListener("click", () => {

  const button =
  document.getElementById("payBtn");

  const message =
  document.getElementById("message");


  if (!currentUser) {

    message.textContent =
    "Please login first.";

    return;
  }


  if (!selectedCourse || !course) {

    message.textContent =
    "Invalid course.";

    return;
  }


  if (
    !RAZORPAY_KEY_ID ||
    RAZORPAY_KEY_ID ===
    "YOUR_FULL_RAZORPAY_TEST_KEY_ID"
  ) {

    message.textContent =
    "Please add your Razorpay Test Key ID.";

    return;
  }


  button.disabled = true;

  button.textContent =
  "Creating Order...";

  message.textContent = "";


  const callbackName =
  "razorpayCallback_" +
  Date.now();


  window[callbackName] =
  function(data) {


    delete window[callbackName];


    if (!data.success) {

      message.textContent =
      data.message ||
      "Order creation failed.";

      button.disabled = false;

      button.textContent =
      "Pay Now";

      return;
    }


    // =========================
    // RAZORPAY CHECKOUT
    // =========================

    const options = {

      key:
      RAZORPAY_KEY_ID,

      amount:
      data.amount,

      currency:
      data.currency,

      name:
      "Al Noor Islamic Academy",

      description:
      data.course_name,

      order_id:
      data.order_id,


      prefill: {

        name:
        document.getElementById("name").value,

        email:
        document.getElementById("email").value,

        contact:
        document.getElementById("mobile").value

      },


      theme: {

        color:
        "#d4af37"

      },


      handler:
      function(response) {

        console.log(
          "Payment ID:",
          response.razorpay_payment_id
        );

        console.log(
          "Order ID:",
          response.razorpay_order_id
        );

        console.log(
          "Signature:",
          response.razorpay_signature
        );


        message.textContent =
        "Verifying payment...";

        const verifyCallbackName =
        "verifyCallback_" + Date.now();

        window[verifyCallbackName] =
        async function(verifyResult) {

          delete window[verifyCallbackName];

          if (!verifyResult.success) {

            message.textContent =
            verifyResult.message ||
            "Payment verification failed.";

            button.disabled = false;
            button.textContent = "Pay Now";
            return;
          }

          try {

            const studentRef =
            doc(db, "students", currentUser.uid);

            const courseField =
            course === "tajweed"
              ? "tajweedActive"
              : "arabicLanguageActive";

            const paymentField =
            course === "tajweed"
              ? "tajweedPaymentId"
              : "arabicLanguagePaymentId";

            const orderField =
            course === "tajweed"
              ? "tajweedOrderId"
              : "arabicLanguageOrderId";

            const purchaseField =
            course === "tajweed"
              ? "tajweedPurchasedAt"
              : "arabicLanguagePurchasedAt";

            await updateDoc(studentRef, {
              [courseField]: true,
              [paymentField]: response.razorpay_payment_id,
              [orderField]: response.razorpay_order_id,
              [purchaseField]: serverTimestamp()
            });

            message.innerHTML =
            "Payment completed successfully.<br>" +
            courseName +
            " access activated.";

            button.textContent = "Course Activated";

          } catch (error) {

            console.error(error);

            message.textContent =
            "Payment verified, but course activation failed. Please contact admin.";

            button.disabled = false;
            button.textContent = "Pay Now";
          }
        };

        const verifyScript =
        document.createElement("script");

        verifyScript.src =
        BACKEND_URL +
        "?action=verify" +
        "&payment_id=" +
        encodeURIComponent(response.razorpay_payment_id) +
        "&order_id=" +
        encodeURIComponent(response.razorpay_order_id) +
        "&signature=" +
        encodeURIComponent(response.razorpay_signature) +
        "&callback=" +
        encodeURIComponent(verifyCallbackName);

        verifyScript.onerror =
        function() {

          delete window[verifyCallbackName];

          message.textContent =
          "Unable to verify payment.";

          button.disabled = false;
          button.textContent = "Pay Now";
        };

        document.body.appendChild(verifyScript);

      },


      modal: {

        ondismiss:
        function() {

          button.disabled =
          false;

          button.textContent =
          "Pay Now";

          message.textContent =
          "Payment window closed.";

        }

      }

    };


    const razorpay =
    new Razorpay(options);

    razorpay.open();

  };


  // =========================
  // JSONP REQUEST
  // =========================

  const script =
  document.createElement("script");


  script.src =
  BACKEND_URL +
  "?course=" +
  encodeURIComponent(course) +
  "&callback=" +
  encodeURIComponent(callbackName);


  script.onerror =
  function() {

    delete window[callbackName];

    message.textContent =
    "Unable to connect to payment server.";

    button.disabled =
    false;

    button.textContent =
    "Pay Now";

  };


  document.body.appendChild(script);

});

</script>

</body>
</html>
