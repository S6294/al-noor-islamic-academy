<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Schedule - Al Noor Islamic Academy</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#071a17;
    color:#fff;
    min-height:100vh;
}

header{
    padding:18px 20px;
    background:#0b2520;
    border-bottom:1px solid #29453e;
    text-align:center;
}

.logo{
    color:#d4af37;
    font-size:20px;
    font-weight:bold;
}

.container{
    max-width:800px;
    margin:auto;
    padding:30px 20px;
}

.title{
    color:#d4af37;
    font-size:28px;
    margin-bottom:8px;
}

.subtitle{
    color:#aaa;
    margin-bottom:25px;
}

.schedule-box{
    background:#0c2923;
    border:1px solid #29453e;
    border-radius:18px;
    padding:18px;
}

.schedule-row{
    display:grid;
    grid-template-columns:130px 110px 1fr;
    gap:12px;
    align-items:center;
    padding:15px;
    margin-bottom:10px;
    background:#071a17;
    border:1px solid #29453e;
    border-radius:12px;
}

.schedule-row:last-child{
    margin-bottom:0;
}

.day{
    color:#d4af37;
    font-weight:bold;
}

.time,
.subject{
    color:#aaa;
    font-size:14px;
}

.back{
    display:block;
    margin-top:22px;
    text-align:center;
    color:#d4af37;
    text-decoration:none;
}

.status{
    text-align:center;
    color:#aaa;
    padding:20px 5px;
}

@media(max-width:600px){
    .schedule-row{
        grid-template-columns:1fr 1fr;
    }

    .day{
        grid-column:1 / -1;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">AL NOOR ISLAMIC ACADEMY</div>
</header>

<main class="container">

    <h1 class="title">📅 Weekly Schedule</h1>
    <p class="subtitle">Your weekly class schedule</p>

    <div class="schedule-box" id="scheduleList">
        <div class="status">Loading schedule...</div>
    </div>

    <a href="dashboard.html" class="back">← Back to Dashboard</a>

</main>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import { getAuth, onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import { getFirestore, doc, getDoc }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig = {
    apiKey: "AIzaSyBvugRPCyDcq0gJsE_eUsaoVExi5Rc614k",
    authDomain: "al-noor-islamic-academy.firebaseapp.com",
    projectId: "al-noor-islamic-academy",
    storageBucket: "al-noor-islamic-academy.firebasestorage.app",
    messagingSenderId: "571799539455",
    appId: "1:571799539455:web:d42728685908430296c6ca"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const scheduleList = document.getElementById("scheduleList");

const days = [
    ["saturday", "Saturday"],
    ["sunday", "Sunday"],
    ["monday", "Monday"],
    ["tuesday", "Tuesday"],
    ["wednesday", "Wednesday"],
    ["thursday", "Thursday"],
    ["friday", "Friday"]
];


async function loadSchedule(){

    try{

        const scheduleRef = doc(db, "schedule", "weekly");
        const scheduleSnap = await getDoc(scheduleRef);

        if(!scheduleSnap.exists()){

            scheduleList.innerHTML =
                '<div class="status">No schedule has been added yet.</div>';

            return;
        }

        const data = scheduleSnap.data();

        scheduleList.innerHTML = days.map(([key, day]) => {

            const time = data[key]?.time || "—";
            const subject = data[key]?.subject || "—";

            return `
                <div class="schedule-row">
                    <div class="day">${day}</div>
                    <div class="time">${time}</div>
                    <div class="subject">${subject}</div>
                </div>
            `;

        }).join("");

    }catch(error){

        console.error(error);

        scheduleList.innerHTML =
            '<div class="status">Unable to load schedule.</div>';
    }
}


onAuthStateChanged(auth, async user => {

    if(!user){

        window.location.replace("admin-login.html");
        return;
    }

    await loadSchedule();

});

</script>

</body>
</html>
