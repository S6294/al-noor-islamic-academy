<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notifications | Al Noor Islamic Academy</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#071c16;
    color:white;
}

header{
    background:#0b261e;
    padding:18px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #d4af37;
}

.logo{
    color:#d4af37;
    font-size:22px;
    font-weight:bold;
}

.profile{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#d4af37;
    color:#071c16;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.container{
    max-width:850px;
    margin:auto;
    padding:30px 18px;
}

h1{
    text-align:center;
    color:#d4af37;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#aebdb8;
    margin-bottom:30px;
}

.notification{
    background:#0b261e;
    border:1px solid #31594d;
    border-radius:15px;
    padding:20px;
    margin-bottom:15px;
    transition:.2s;
}

.notification:hover{
    border-color:#d4af37;
}

.notification-header{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:10px;
}

.icon{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#183d31;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    flex-shrink:0;
}

.notification h3{
    color:#fff;
    font-size:17px;
}

.date{
    color:#7f9990;
    font-size:12px;
    margin-top:4px;
}

.message{
    color:#b9c9c3;
    line-height:1.7;
    margin-top:8px;
}

.new{
    display:inline-block;
    background:#d4af37;
    color:#071c16;
    padding:4px 9px;
    border-radius:6px;
    font-size:11px;
    font-weight:bold;
    margin-left:auto;
}

.loading{
    text-align:center;
    color:#d4af37;
    padding:30px 10px;
}

.empty{
    text-align:center;
    color:#aebdb8;
    padding:30px 10px;
}

.error{
    text-align:center;
    color:#ff8a80;
    padding:30px 10px;
}

.back{
    display:block;
    text-align:center;
    margin-top:30px;
    color:#d4af37;
    text-decoration:none;
}

footer{
    text-align:center;
    color:#718b82;
    padding:30px 10px;
    margin-top:20px;
    border-top:1px solid #193b31;
}

</style>

</head>


<body>


<header>

    <div class="logo">
        AL NOOR
    </div>

    <div class="profile" id="profile">
        ?
    </div>

</header>


<div class="container">

    <h1>Notifications</h1>

    <p class="subtitle">
        Stay updated with Al Noor Islamic Academy
    </p>


    <div id="notificationsList">

        <div class="loading">
            Loading notifications...
        </div>

    </div>


    <a href="dashboard.html" class="back">
        ← Back to Dashboard
    </a>

</div>


<footer>

    © 2026 Al Noor Islamic Academy

</footer>



<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    getDocs
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";



const firebaseConfig = {

    apiKey:
    "AIzaSyBvugRPCyDcq0gJsE_eUsaoVExi5Rc614k",

    authDomain:
    "al-noor-islamic-academy.firebaseapp.com",

    projectId:
    "al-noor-islamic-academy",

    storageBucket:
    "al-noor-islamic-academy.firebasestorage.app",

    messagingSenderId:
    "571799539455",

    appId:
    "1:571799539455:web:d42728685908430296c6ca"

};



const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const db =
getFirestore(app);



const list =
document.getElementById(
    "notificationsList"
);



onAuthStateChanged(
    auth,
    async (user) => {


        if (!user) {

            window.location.href =
            "login.html";

            return;

        }



        try {


            // Student name initial

            const name =
            user.displayName ||
            user.email ||
            "Student";


            document.getElementById(
                "profile"
            ).textContent =
            name
            .charAt(0)
            .toUpperCase();



            // Get notifications

            const snapshot =
            await getDocs(
                collection(
                    db,
                    "notifications"
                )
            );



            list.innerHTML = "";



            if (
                snapshot.empty
            ) {

                list.innerHTML = `
                    <div class="empty">
                        No notifications available.
                    </div>
                `;

                return;

            }



            snapshot.forEach(
                (docSnap) => {


                    const data =
                    docSnap.data();



                    const notification =
                    document.createElement(
                        "div"
                    );


                    notification.className =
                    "notification";



                    notification.innerHTML = `

                        <div class="notification-header">

                            <div class="icon">
                                ${data.icon || "📢"}
                            </div>

                            <div>

                                <h3>
                                    ${data.title || "Notification"}
                                </h3>

                                <div class="date">
                                    ${data.date || "Recently"}
                                </div>

                            </div>

                            ${
                                data.isNew
                                ? `<span class="new">NEW</span>`
                                : ""
                            }

                        </div>


                        <div class="message">

                            ${data.message || ""}

                        </div>

                    `;



                    list.appendChild(
                        notification
                    );

                }
            );


        }

        catch (error) {

            console.error(
                error
            );


            list.innerHTML = `

                <div class="error">

                    Unable to load notifications.

                </div>

            `;

        }

    }
);

</script>


</body>

</html>
