<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Profile - Al Noor Islamic Academy</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #071c16;
      color: white;
      min-height: 100vh;
    }

    .header {
      background: #0b2a21;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #c9a227;
    }

    .logo {
      color: #d4af37;
      font-size: 21px;
      font-weight: bold;
    }

    .back {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
    }

    .profile-card {
      background: #0d2d24;
      border: 1px solid #c9a227;
      border-radius: 18px;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #c9a227;
      color: #071c16;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 38px;
      font-weight: bold;
      margin: 0 auto 15px;
    }

    h2 {
      margin-bottom: 25px;
      color: #d4af37;
    }

    .info {
      text-align: left;
    }

    .row {
      background: #12382e;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .label {
      color: #b8c9c3;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .value {
      color: white;
      font-size: 16px;
      word-break: break-word;
    }

    .status {
      color: #6ee7a8;
      font-weight: bold;
    }

    .membership {
      color: #d4af37;
      font-weight: bold;
    }

    .payment-box {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(212,175,55,0.4);
      text-align: left;
    }

    .payment-title {
      color: #d4af37;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .not-paid {
      color: #fbbf24;
      font-weight: bold;
    }

    .paid {
      color: #6ee7a8;
      font-weight: bold;
    }

    .logout {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #b3261e;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .loading {
      color: #d4af37;
      margin: 20px 0;
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="logo">AL NOOR</div>
    <a href="dashboard.html" class="back">← Dashboard</a>
  </header>


  <div class="container">

    <div class="profile-card">

      <div class="avatar" id="avatar">?</div>

      <h2>My Profile</h2>

      <div class="loading" id="loading">
        Loading profile...
      </div>


      <div class="info" id="profileInfo" style="display:none;">

        <!-- BASIC INFORMATION -->

        <div class="row">
          <div class="label">Name</div>
          <div class="value" id="name">-</div>
        </div>

        <div class="row">
          <div class="label">Email</div>
          <div class="value" id="email">-</div>
        </div>

        <div class="row">
          <div class="label">Mobile</div>
          <div class="value" id="mobile">-</div>
        </div>


        <!-- MEMBERSHIP -->

        <div class="row">
          <div class="label">Membership</div>
          <div class="value membership" id="membership">
            None
          </div>
        </div>

        <div class="row">
          <div class="label">Membership Status</div>
          <div class="value status" id="membershipStatus">
            Not Active
          </div>
        </div>

        <div class="row">
          <div class="label">Account Status</div>
          <div class="value status" id="status">
            -
          </div>
        </div>


        <!-- PAYMENT INFORMATION -->

        <div class="payment-box">

          <div class="payment-title">
            Payment Information
          </div>

          <div class="row">
            <div class="label">Amount</div>
            <div class="value" id="amount">
              Not Paid Yet
            </div>
          </div>

          <div class="row">
            <div class="label">Payment ID</div>
            <div class="value" id="paymentId">
              Not Paid Yet
            </div>
          </div>

          <div class="row">
            <div class="label">Order ID</div>
            <div class="value" id="orderId">
              Not Paid Yet
            </div>
          </div>

          <div class="row">
            <div class="label">Payment Date</div>
            <div class="value" id="paidAt">
              Not Paid Yet
            </div>
          </div>

        </div>


        <!-- USER ID -->

        <div class="row">
          <div class="label">User ID</div>
          <div class="value" id="uid">
            -
          </div>
        </div>

      </div>


      <button class="logout" id="logoutBtn">
        Logout
      </button>

    </div>

  </div>


  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc
    } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyBvugRPCyDcq0gJsE_eUsaoVExi5Rc614k",

      authDomain:
        "al-noor-islamic-academy.firebaseapp.com",

      projectId:
        "al-noor-islamic-academy",

      storageBucket:
        "al-noor-islamic-academy.firebasestorage.app",

      messagingSenderId:
        "571799539455",

      appId:
        "1:571799539455:web:d42728685908430296c6ca"
    };


    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getFirestore(app);


    onAuthStateChanged(auth, async (user) => {

      if (!user) {

        window.location.href =
          "login.html";

        return;
      }


      try {

        const studentRef =
          doc(
            db,
            "students",
            user.uid
          );


        const studentSnap =
          await getDoc(studentRef);


        if (studentSnap.exists()) {

          const data =
            studentSnap.data();


          // BASIC INFORMATION

          document.getElementById("name")
            .textContent =
              data.name ||
              user.displayName ||
              "-";


          document.getElementById("email")
            .textContent =
              data.email ||
              user.email ||
              "-";


          document.getElementById("mobile")
            .textContent =
              data.mobile ||
              "Not added";


          // MEMBERSHIP

          document.getElementById("membership")
            .textContent =
              data.membership ||
              "None";


          document.getElementById("membershipStatus")
            .textContent =
              data.membershipStatus ||
              "Not Active";


          document.getElementById("status")
            .textContent =
              data.status ||
              "Active";


          // PAYMENT AMOUNT

          if (data.membershipAmount) {

            document.getElementById("amount")
              .textContent =
                "₹" +
                data.membershipAmount;

          } else {

            document.getElementById("amount")
              .textContent =
                "Not Paid Yet";

          }


          // PAYMENT ID

          document.getElementById("paymentId")
            .textContent =
              data.paymentId ||
              "Not Paid Yet";


          // ORDER ID

          document.getElementById("orderId")
            .textContent =
              data.orderId ||
              "Not Paid Yet";


          // PAYMENT DATE

          if (
            data.paidAt &&
            data.paidAt.toDate
          ) {

            const date =
              data.paidAt.toDate();

            document.getElementById("paidAt")
              .textContent =
                date.toLocaleString();

          } else {

            document.getElementById("paidAt")
              .textContent =
                "Not Paid Yet";

          }


          // USER ID

          document.getElementById("uid")
            .textContent =
              data.uid ||
              user.uid;


          // AVATAR

          const name =
            data.name ||
            user.displayName ||
            user.email ||
            "?";


          document.getElementById("avatar")
            .textContent =
              name
                .charAt(0)
                .toUpperCase();


          // SHOW PROFILE

          document.getElementById("loading")
            .style.display =
              "none";

          document.getElementById("profileInfo")
            .style.display =
              "block";


        } else {

          document.getElementById("loading")
            .textContent =
              "Profile data not found.";

        }


      } catch (error) {

        console.error(error);

        document.getElementById("loading")
          .textContent =
          "Unable to load profile.";

      }

    });


    // LOGOUT

    document.getElementById("logoutBtn")
      .addEventListener(
        "click",
        async () => {

          await signOut(auth);

          window.location.href =
            "login.html";

        }
      );

  </script>

</body>
                </html>
