<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Courses - Al Noor Islamic Academy</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#071c16;
    color:white;
}

header{
    background:#0d2b22;
    padding:18px 20px;
    border-bottom:1px solid #c9a227;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:#d4af37;
    font-size:20px;
    font-weight:bold;
}

.back{
    color:#d4af37;
    text-decoration:none;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:30px 18px;
}

h1{
    color:#d4af37;
    margin-bottom:8px;
}

.subtitle{
    color:#b9c8c2;
    margin-bottom:25px;
}

.course-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.course{
    background:#0d2b22;
    border:1px solid #21473b;
    border-radius:15px;
    padding:22px;
}

.course h2{
    color:#d4af37;
    margin-bottom:10px;
}

.course p{
    color:#c8d2ce;
    line-height:1.6;
    margin-bottom:12px;
}

.price{
    color:#ffd86a !important;
    font-weight:bold;
}

.type{
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    background:#174d38;
    color:#8ff0bd;
    font-size:12px;
    margin-bottom:15px;
}

.course-btn{
    display:inline-block;
    background:#d4af37;
    color:#071c16;
    text-decoration:none;
    padding:11px 16px;
    border-radius:8px;
    font-weight:bold;
}

.empty{
    text-align:center;
    padding:40px;
    color:#9eb0a9;
}

#loading{
    text-align:center;
    padding:60px 20px;
    color:#d4af37;
}

#content{
    display:none;
}

@media(max-width:700px){
    .course-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div id="loading">
    Loading courses...
</div>

<div id="content">

<header>

    <div class="logo">
        AL NOOR
    </div>

    <a href="dashboard.html" class="back">
        ← Dashboard
    </a>

</header>


<div class="container">

    <h1>📚 Our Courses</h1>

    <p class="subtitle">
        Learn Quran, Arabic and Islamic studies online.
    </p>

    <div id="courseList" class="course-grid">
    </div>

</div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyBvugRPCyDcq0gJsE_eUsaoVExi5Rc614k",

    authDomain:
    "al-noor-islamic-academy.firebaseapp.com",

    projectId:
    "al-noor-islamic-academy",

    storageBucket:
    "al-noor-islamic-academy.firebasestorage.app",

    messagingSenderId:
    "571799539455",

    appId:
    "1:571799539455:web:d42728685908430296c6ca"
};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


const loading =
document.getElementById("loading");

const content =
document.getElementById("content");

const courseList =
document.getElementById("courseList");


onAuthStateChanged(auth, async (user) => {

    if(!user){

        window.location.href =
        "login.html";

        return;
    }


    loading.style.display =
    "none";

    content.style.display =
    "block";

    await loadCourses();

});


async function loadCourses(){

    courseList.innerHTML =
    "Loading courses...";


    try{

        const snapshot =
        await getDocs(
            collection(db,"courses")
        );


        courseList.innerHTML = "";


        if(snapshot.empty){

            courseList.innerHTML = `
                <div class="empty">
                    No courses available yet.
                </div>
            `;

            return;
        }


        snapshot.forEach((item) => {

            const data =
            item.data();


            const name =
            escapeHtml(
                data.name || "Course"
            );

            const description =
            escapeHtml(
                data.description || ""
            );

            const type =
            data.type || "Paid";

            const price =
            Number(data.price || 0);


            let buttonLink =
            "membership.html";

            let buttonText =
            "Enroll Now";


            // Quran Reading detail page
            if(
                name.toLowerCase()
                === "quran reading"
            ){

                buttonLink =
                "quran-course.html";

                buttonText =
                "View Course";
            }


            const div =
            document.createElement("div");

            div.className =
            "course";


            div.innerHTML = `

                <h2>
                    📚 ${name}
                </h2>

                <p>
                    ${description}
                </p>

                <span class="type">
                    ${escapeHtml(type)}
                </span>

                <p class="price">
                    ${
                        type === "Free"
                        ? "Free"
                        : "₹" + price
                    }
                </p>

                <a
                    href="${buttonLink}"
                    class="course-btn"
                >
                    ${buttonText}
                </a>

            `;


            courseList.appendChild(div);

        });


    }catch(error){

        console.error(error);

        courseList.innerHTML = `
            <div class="empty">
                Failed to load courses.
            </div>
        `;

    }

}


function escapeHtml(value){

    return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

</script>

</body>
</html>
