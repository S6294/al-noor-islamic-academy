<!DOCTYPE html>
< lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Al Noor Islamic Academy</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family: Arial, sans-serif;

            background: #071a17;

            color: white;
        }

        .login-box {
            width: 100%;
            max-width: 400px;

            background: #0c2923;

            padding: 35px 25px;

            border-radius: 20px;

            border: 1px solid #36554d;

            box-shadow: 0 15px 40px rgba(0,0,0,0.4);

            text-align: center;
        }

        .logo {
            width: 75px;
            height: 75px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #d4af37;

            color: #071a17;

            font-size: 24px;

            font-weight: bold;
        }

        h1 {
            color: #d4af37;

            font-size: 28px;

            margin-bottom: 8px;
        }

        .subtitle {
            color: #aaa;

            font-size: 14px;

            margin-bottom: 28px;
        }

        .input-group {
            text-align: left;

            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            color: #ddd;

            font-size: 14px;
        }

        input {
            width: 100%;

            padding: 14px;

            border: 1px solid #42635a;

            border-radius: 10px;

            background: #071a17;

            color: white;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #d4af37;
        }

        .login-button {
            width: 100%;

            padding: 14px;

            margin-top: 5px;

            border: none;

            border-radius: 10px;

            background: #d4af37;

            color: #071a17;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .forgot {
            display: block;

            margin-top: 18px;

            color: #d4af37;

            text-decoration: none;

            font-size: 14px;
        }

        .signup {
            margin-top: 25px;

            color: #aaa;

            font-size: 14px;
        }

        .signup a {
            color: #d4af37;

            text-decoration: none;

            font-weight: bold;
        }

        .home {
            display: block;

            margin-top: 20px;

            color: #aaa;

            text-decoration: none;

            font-size: 13px;
        }

    </style>

</head>


<body>


    <div class="login-box">


        <div class="logo">
            AN
        </div>


        <h1>
            Welcome Back
        </h1>


        <p class="subtitle">
            Login to Al Noor Islamic Academy
        </p>


        <>


            <div class="input-group">

                <label>
                    Email or Mobile Number
                </label>

                <input
                    type="text"
                    placeholder="Enter email or mobile"
                    required
                >

            </div>


            <div class="input-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button">

                Login

            </button>
